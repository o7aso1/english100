<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مئة يوم إنجليزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4ECF3; --card:#FFFFFF; --ink:#14213D; --muted:#586A82; --line:#C6D3E0;
  --rule:rgba(70,120,180,.15); --redline:#E4606D; --mark:#FFD84D; --markfg:#14213D;
  --good:#0B8A68; --bad:#CF3E57; --btn:#14213D; --btnfg:#FFFFFF; --stack:#BCCADA; --focus:#14213D;
  --ar:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --en:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C1422; --card:#15223A; --ink:#E9EFF8; --muted:#8FA2BD; --line:#2A3C58;
    --rule:rgba(140,180,235,.09); --redline:#D4505E; --mark:#8B6F12; --markfg:#FFF6D6;
    --good:#3DD6A6; --bad:#FF7A8E; --btn:#F2C531; --btnfg:#0C1422; --stack:#22324D; --focus:#F2C531;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1422; --card:#15223A; --ink:#E9EFF8; --muted:#8FA2BD; --line:#2A3C58;
  --rule:rgba(140,180,235,.09); --redline:#D4505E; --mark:#8B6F12; --markfg:#FFF6D6;
  --good:#3DD6A6; --bad:#FF7A8E; --btn:#F2C531; --btnfg:#0C1422; --stack:#22324D; --focus:#F2C531;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.7;
  padding-bottom:calc(86px + env(safe-area-inset-bottom))}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
h1,h2,p{margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 6px}
.brand{font-size:1.2rem;font-weight:700;letter-spacing:0}
.top-r{display:flex;align-items:center;gap:8px}
.chip{background:var(--mark);color:var(--markfg);border-radius:999px;padding:1px 12px;font-size:.85rem;font-weight:600}
.icon-btn{width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 20px;font-weight:600;
  border:1.5px solid var(--ink);background:none}
.btn.primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn svg{width:18px;height:18px}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--mark);text-decoration-thickness:3px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:26px 0 8px}
.muted{color:var(--muted)}

/* today */
.daynav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;margin:14px 0 4px}
.round{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.daytitle{text-align:center}
.num{font-family:var(--en);font-weight:700;font-size:4.2rem;line-height:1;letter-spacing:-.02em}
.of{color:var(--muted);font-size:.95rem;margin-top:4px}
.badge{display:inline-block;margin-inline-start:8px;padding:0 10px;border-radius:999px;background:var(--good);color:var(--paper);font-size:.78rem;font-weight:700}
.sub{text-align:center;font-size:.92rem;margin-bottom:20px;min-height:30px}
.stack{display:grid;gap:26px}
.flash{position:relative;perspective:1300px;border-radius:8px;box-shadow:0 1px 0 var(--line),0 7px 0 -2px var(--stack)}
.flip{display:grid;width:100%;padding:0;border:0;background:none;text-align:start;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.3,.7,.2,1);border-radius:8px}
.is-flipped .flip{transform:rotateY(180deg)}
.face{grid-area:1/1;display:flex;flex-direction:column;min-height:176px;border:1px solid var(--line);border-radius:8px;overflow:hidden;
  background-color:var(--card);
  background-image:linear-gradient(var(--redline),var(--redline)),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-size:100% 2px,100% 100%;background-position:0 31px,0 0;background-repeat:no-repeat,repeat;
  backface-visibility:hidden;-webkit-backface-visibility:hidden}
.back{transform:rotateY(180deg)}
.band{height:31px;padding:0 16px;display:flex;align-items:center;font-size:.8rem;color:var(--muted)}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:12px 18px 20px}
.front .body{align-items:center;text-align:center}
.en{font-family:var(--en);font-weight:700;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.15;letter-spacing:-.01em}
.mk{padding:0 .1em;background-image:linear-gradient(transparent 56%,var(--mark) 56%,var(--mark) 90%,transparent 90%);
  background-repeat:no-repeat;background-size:0 100%;animation:sweep .6s cubic-bezier(.4,0,.2,1) calc(.12s + var(--i,0)*.17s) forwards}
@keyframes sweep{to{background-size:100% 100%}}
.ar{font-size:1.65rem;font-weight:600;line-height:1.4}
.ex{color:var(--muted);font-size:1rem;text-align:left}
.hl{font-weight:700;color:var(--ink);background:linear-gradient(transparent 60%,var(--mark) 60%)}
.tools{position:absolute;top:0;inset-inline-end:6px;height:31px;display:flex;align-items:center;gap:2px;z-index:2}
.tool{width:32px;height:28px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:8px}
.tool svg{width:19px;height:19px}
.tool.on{color:var(--ink)}
.tool.on svg{fill:var(--mark)}

/* practice */
.due{display:flex;align-items:baseline;gap:14px;margin:22px 0 6px}
.due .n{font-family:var(--en);font-weight:700;font-size:4.4rem;line-height:1}
.due p{font-size:1.1rem;font-weight:500}
.hint{color:var(--muted);font-size:.95rem;margin-bottom:16px}
.rows{margin:26px 0 8px;border-top:1px solid var(--line)}
.rowbtn{display:flex;width:100%;align-items:center;justify-content:space-between;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start}
.rowbtn .c{font-family:var(--en);font-weight:700;font-size:1.3rem}
.sec{font-weight:600;margin:26px 0 10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:4px 16px;font-size:.95rem}
.seg button.on{background:var(--btn);color:var(--btnfg);border-color:var(--btn);font-weight:600}

/* quiz */
.qhead{display:flex;align-items:center;gap:14px;margin:18px 0 20px}
.qprog{flex:1;height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.qprog span{display:block;height:100%;background:var(--mark);transition:width .3s}
.qcount{font-family:var(--en);font-weight:700;direction:ltr;min-width:48px;text-align:end}
.sheet{border:1px solid var(--line);border-radius:8px;padding:30px 18px 26px;text-align:center;margin-bottom:18px;
  background-color:var(--card);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  box-shadow:0 1px 0 var(--line),0 7px 0 -2px var(--stack)}
.sheet .en{display:block}
.sheet .ar{display:block}
.sheet .ex{text-align:center;margin-top:10px;direction:ltr}
.sheet .tool{width:44px;height:44px;margin:6px auto 0;border:1.5px solid var(--line);border-radius:50%;color:var(--ink)}
.sheet .tool svg{width:22px;height:22px}
.listen-btn{width:84px;height:84px;border-radius:50%;border:0;background:var(--btn);color:var(--btnfg);display:grid;place-items:center;margin:0 auto 6px}
.listen-btn svg{width:36px;height:36px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1.08rem}
.opt.enopt{direction:ltr;text-align:left;font-family:var(--en);font-weight:500;font-size:1.25rem}
.opt .k{font-family:var(--en);font-size:.85rem;color:var(--muted);width:20px;flex:none;text-align:center}
.opt:disabled{opacity:1;cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
@media (hover:none){.opt .k{display:none}}
.ans{width:100%;direction:ltr;text-align:center;font-family:var(--en);font-size:1.6rem;font-weight:500;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);margin-top:14px}
.ans.ok{border-color:var(--good)} .ans.no{border-color:var(--bad)}
.blankhint{font-family:var(--en);letter-spacing:.2em;direction:ltr;margin-top:8px;color:var(--muted)}
.fb{margin-top:6px;padding:16px;border-radius:10px;border:1.5px solid var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.fb.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card));font-weight:600}
.fb .line{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:1.1rem}
.fb .line .en{font-size:1.5rem}
.fb .ex{margin:4px 0 12px}
.score{display:flex;align-items:baseline;gap:12px;justify-content:center;margin:30px 0 6px}
.score .n{font-family:var(--en);font-weight:700;font-size:5rem;line-height:1}
.result p{text-align:center}
.missed{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.missed li{display:flex;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.missed .en{font-size:1.3rem}

/* words */
.searchbar{margin:18px 0 12px}
.searchbar input{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.wrow{display:flex;justify-content:space-between;gap:10px;padding:14px 2px;border-bottom:1px solid var(--line)}
.wmain{display:flex;flex-direction:column;min-width:0}
.wmain .w{font-family:var(--en);font-weight:700;font-size:1.4rem;line-height:1.3;direction:ltr;text-align:start}
.wmain .m{font-weight:500}
.wmain .e{color:var(--muted);font-size:.9rem;direction:ltr;text-align:start}
.wtools{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.wtools .tl{display:flex}
.daychip{border:0;background:none;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}

/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;margin:20px 0 8px}
.stat{padding:16px 2px;border-top:1px solid var(--line)}
.stat .n{font-family:var(--en);font-weight:700;font-size:2.6rem;line-height:1.1}
.stat .l{color:var(--muted);font-size:.92rem}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:var(--en);font-weight:500;font-size:.78rem;padding:0;display:grid;place-items:center}
.cell.done{background:var(--mark);color:var(--markfg);border-color:transparent}
.cell.now{outline:2.5px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-inline-end:6px;background:var(--card)}
.legend i.d{background:var(--mark);border-color:transparent}
.legend i.n{outline:2px solid var(--ink);outline-offset:0}

/* tabs */
.tabs{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:9px 4px 8px;color:var(--muted);font-size:.78rem;font-weight:500;position:relative}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;width:34px;height:4px;border-radius:0 0 4px 4px;background:var(--mark)}

/* dialog + toast */
dialog{width:min(92vw,440px);border:0;border-radius:16px;padding:22px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(8,14,26,.55)}
dialog h2{font-size:1.2rem;margin-bottom:12px}
.set{padding:14px 0;border-top:1px solid var(--line)}
.set .lbl{font-weight:600;margin-bottom:8px}
.note{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);background:var(--ink);color:var(--paper);
  padding:9px 18px;border-radius:999px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  .mk{animation:none;background-size:100% 100%}
  .flip,.toast,.qprog span{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">مئة يوم إنجليزي</h1>
    <div class="top-r">
      <span class="chip" id="streak" hidden></span>
      <button class="icon-btn" data-a="openSettings" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h10M20 17h0"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>
  <main id="app"></main>
</div>

<nav class="tabs" aria-label="التنقل">
  <div class="tabs-in" id="tabs">
    <button data-a="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16"/></svg>اليوم</button>
    <button data-a="tab" data-tab="practice"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>تدريب</button>
    <button data-a="tab" data-tab="words"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>الكلمات</button>
    <button data-a="tab" data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>التقدم</button>
  </div>
</nav>

<dialog id="settings"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const WORDS = RAW.trim().split("\n").map((l, i) => {
  const [d, w, m, e] = l.split("|");
  return { id: i, d: +d, w, m, e };
});
const BY_DAY = {};
WORDS.forEach(x => (BY_DAY[x.d] = BY_DAY[x.d] || []).push(x));

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const pad = n => String(n).padStart(2, "0");
const dstr = (d = new Date()) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr();
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return dstr(d); };
const arDays = n => n === 1 ? "يوم" : n === 2 ? "يومان" : n <= 10 ? n + " أيام" : n + " يومًا";

const I = {
  speaker: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5l4.5 3.5V6L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>',
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8L12 3.6z"/></svg>',
  next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  prev: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  flip: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/></svg>'
};

/* ---------- state ---------- */
const KEY = "english100_v2", OLD = "english100_v1";
const fresh = () => ({ done: [], srs: {}, hard: {}, log: {}, stats: { a: 0, c: 0 }, theme: "auto", rate: 0.9 });
function load() {
  const s = fresh();
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  if (!s.done.length) {
    try { const o = JSON.parse(localStorage.getItem(OLD)); if (o && Array.isArray(o.done)) s.done = o.done; } catch (e) {}
  }
  return s;
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const touch = () => { const t = today(); S.log[t] = (S.log[t] || 0) + 1; };

const lessonDay = () => { for (let d = 1; d <= 100; d++) if (!S.done.includes(d)) return d; return 100; };
const streak = () => { let d = today(); if (!S.log[d]) d = addDays(d, -1); let n = 0; while (S.log[d]) { n++; d = addDays(d, -1); } return n; };

const INT = [0, 1, 3, 7, 14];
function grade(id, ok) {
  const t = today();
  const s = S.srs[id] || { box: 0, due: t };
  s.box = ok ? Math.min(4, s.box + 1) : 0;
  s.due = addDays(t, ok ? INT[s.box] : 0);
  S.srs[id] = s;
  S.stats.a++; if (ok) S.stats.c++;
  touch(); save();
}
const dueWords = () => WORDS.filter(w => S.srs[w.id] && S.srs[w.id].due <= today());
const learnedWords = () => WORDS.filter(w => S.done.includes(w.d) || S.srs[w.id]);
const hardWords = () => WORDS.filter(w => S.hard[w.id]);

const ui = { tab: "today", view: lessonDay(), quiz: null, mode: "mixed", filter: "all", q: "", timer: null };

/* ---------- speech + toast ---------- */
function speak(t) {
  if (!("speechSynthesis" in window)) { toast("جهازك ما يدعم النطق"); return; }
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "en-US"; u.rate = S.rate;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
let tt;
function toast(m) {
  const t = $("#toast"); t.textContent = m; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 2300);
}

/* ---------- text utils ---------- */
const wre = w => new RegExp("\\b" + w + "[a-z]*", "i");
const hl = (e, w) => esc(e).replace(wre(w), m => '<b class="hl">' + m + "</b>");
const blank = (e, w) => esc(e).replace(wre(w), "____");
const tok = m => new Set(m.replace(/[()\/،,]/g, " ").split(/\s+/).filter(t => t.length > 1));
function clash(a, b) { const A = tok(a.m); for (const t of tok(b.m)) if (A.has(t)) return true; return false; }

/* ---------- views ---------- */
function cardHTML(x, i) {
  return `<article class="flash" data-id="${x.id}" style="--i:${i}">
    <button class="flip" data-a="flip" aria-pressed="false" aria-label="اقلب بطاقة ${esc(x.w)}">
      <span class="face front"><span class="band">اليوم ${x.d}</span><span class="body"><span class="en" dir="ltr"><span class="mk">${esc(x.w)}</span></span></span></span>
      <span class="face back"><span class="band" dir="ltr">${esc(x.w)}</span><span class="body"><span class="ar">${esc(x.m)}</span><span class="ex" dir="ltr">${hl(x.e, x.w)}</span></span></span>
    </button>
    <div class="tools">
      <button class="tool" data-a="speak" aria-label="استمع">${I.speaker}</button>
      <button class="tool ${S.hard[x.id] ? "on" : ""}" data-a="star" aria-pressed="${!!S.hard[x.id]}" aria-label="علّمها كلمة صعبة">${I.star}</button>
    </div>
  </article>`;
}

function vToday() {
  const L = lessonDay(), v = ui.view, done = S.done.includes(v), all = S.done.length >= 100;
  return `
  <section class="daynav">
    <button class="round" data-a="prev" aria-label="اليوم السابق" ${v <= 1 ? "disabled" : ""}>${I.prev}</button>
    <div class="daytitle"><div class="num">${v}</div><div class="of">من 100${done ? '<span class="badge">منتهي</span>' : ""}</div></div>
    <button class="round" data-a="next" aria-label="اليوم التالي" ${v >= 100 ? "disabled" : ""}>${I.next}</button>
  </section>
  <p class="sub">${v !== L ? `<button class="link" data-a="goLesson">ارجع إلى درس اليوم (يوم ${L})</button>` : all ? "أنهيت الأيام كلها" : '<span class="muted">درس اليوم</span>'}</p>
  <div class="stack">${BY_DAY[v].map(cardHTML).join("")}</div>
  <div class="actions">
    <button class="btn ghost" data-a="flipAll">${I.flip}اقلب الكل</button>
    <button class="btn primary" data-a="done">${done ? "تراجع عن إنهاء اليوم" : "أنهيت اليوم " + v}</button>
  </div>
  ${done ? `<p style="text-align:center;display:flex;gap:22px;justify-content:center;flex-wrap:wrap">
    <button class="link" data-a="quiz" data-scope="day">اختبر كلمات هذا اليوم</button>
    ${v !== L ? '<button class="link" data-a="goLesson">انتقل للدرس التالي</button>' : ""}</p>` : ""}`;
}

function vPractice() {
  if (ui.quiz) return vQuiz();
  const due = dueWords().length, learned = learnedWords().length, hard = hardWords().length;
  const msg = due ? "" : learned ? "راجعت كل شيء لهذا اليوم. ارجع بكرة أو اختبر نفسك من القائمة." : "أنهِ يومًا من الدروس وتظهر كلماته هنا للمراجعة.";
  const seg = [["mixed", "مختلط"], ["mc", "اختيار"], ["rev", "عكسي"], ["listen", "استماع"], ["type", "كتابة"]];
  return `
  <div class="due"><span class="n">${due}</span><p>كلمة تنتظر المراجعة اليوم</p></div>
  <p class="hint">${msg}</p>
  <button class="btn primary" data-a="quiz" data-scope="due" ${due ? "" : "disabled"}>ابدأ المراجعة</button>
  <div class="rows">
    <button class="rowbtn" data-a="quiz" data-scope="day"><span>كلمات اليوم ${ui.view}</span><span class="c">3</span></button>
    <button class="rowbtn" data-a="quiz" data-scope="learned" ${learned ? "" : "disabled"}><span>كل ما تعلمته</span><span class="c">${learned}</span></button>
    <button class="rowbtn" data-a="quiz" data-scope="hard" ${hard ? "" : "disabled"}><span>الكلمات الصعبة</span><span class="c">${hard}</span></button>
  </div>
  <p class="sec">نوع الأسئلة</p>
  <div class="seg">${seg.map(([v, l]) => `<button class="${ui.mode === v ? "on" : ""}" data-a="mode" data-v="${v}">${l}</button>`).join("")}</div>`;
}

function makeQ(id) {
  const w = WORDS[id];
  let types = ui.mode === "mixed" ? ["mc", "rev", "mc", "rev", "listen", "type"] : [ui.mode];
  if (!("speechSynthesis" in window)) types = types.filter(t => t !== "listen");
  if (!types.length) types = ["mc"];
  const type = pick(types);
  const c = { id, type, answered: false, ok: null, chosen: null, typed: "" };
  if (type !== "type") {
    c.opts = shuffle([w, ...shuffle(WORDS).filter(x => x.id !== id && !clash(x, w)).slice(0, 3)]).map(x => x.id);
  }
  return c;
}

function vQuiz() {
  const q = ui.quiz;
  if (q.finished) return vResult();
  const c = q.cur, w = WORDS[c.id];
  const n = Object.keys(q.first).length;
  let body = "";
  if (c.type === "mc") {
    body = `<div class="sheet"><span class="en" dir="ltr">${esc(w.w)}</span><button class="tool" data-a="speak" data-say="${esc(w.w)}" aria-label="استمع">${I.speaker}</button></div>`;
  } else if (c.type === "rev") {
    body = `<div class="sheet"><span class="ar">${esc(w.m)}</span></div>`;
  } else if (c.type === "listen") {
    body = `<div class="sheet"><button class="listen-btn" data-a="speak" data-say="${esc(w.w)}" aria-label="استمع مرة ثانية">${I.speaker}</button><p class="muted">ما معنى الكلمة التي سمعتها؟</p></div>`;
  } else {
    const first = w.w[0].toUpperCase() + (w.w.length > 1 ? " " + Array(w.w.length - 1).fill("_").join(" ") : "");
    body = `<div class="sheet"><span class="ar">${esc(w.m)}</span><span class="ex" dir="ltr" style="display:block">${blank(w.e, w.w)}</span>
      <div class="blankhint">${first}</div>
      <input id="ans" class="ans ${c.answered ? (c.ok ? "ok" : "no") : ""}" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب الكلمة بالإنجليزي" value="${esc(c.typed)}" ${c.answered ? "disabled" : ""}></div>`;
  }
  let choices = "";
  if (c.type !== "type") {
    choices = c.opts.map((oid, i) => {
      const o = WORDS[oid];
      const cls = c.answered ? (oid === c.id ? "ok" : oid === c.chosen ? "no" : "") : "";
      return `<button class="opt ${c.type === "rev" ? "enopt" : ""} ${cls}" data-a="opt" data-i="${oid}" ${c.answered ? "disabled" : ""}><span class="k">${i + 1}</span>${esc(c.type === "rev" ? o.w : o.m)}</button>`;
    }).join("");
  } else if (!c.answered) {
    choices = `<div class="row end"><button class="btn ghost" data-a="skip">لا أعرف</button><button class="btn primary" data-a="submit">تحقق</button></div>`;
  }
  let fb = "";
  if (c.answered && c.ok) fb = `<div class="fb good">صحيح</div>`;
  if (c.answered && !c.ok) fb = `<div class="fb"><div class="line"><span class="en" dir="ltr">${esc(w.w)}</span><span>${esc(w.m)}</span></div><div class="ex" dir="ltr">${hl(w.e, w.w)}</div><button class="btn primary" data-a="nextQ" id="nextBtn">التالي</button></div>`;
  return `
  <div class="qhead">
    <button class="link" data-a="quit">إنهاء</button>
    <div class="qprog"><span style="width:${n / q.total * 100}%"></span></div>
    <span class="qcount">${Math.min(n + 1, q.total)}/${q.total}</span>
  </div>${body}${choices}${fb}`;
}

function vResult() {
  const q = ui.quiz, pct = Math.round(q.correct / q.total * 100);
  return `<section class="result">
    <div class="score"><span class="n">${q.correct}</span><span class="of">من ${q.total}</span></div>
    <p>أجبت صح على ${pct}% من الأسئلة من أول محاولة.</p>
    ${q.missed.length ? `<p class="sec" style="text-align:start">كلمات تحتاج مراجعة</p><ul class="missed">${q.missed.map(id => `<li><span class="en" dir="ltr">${esc(WORDS[id].w)}</span><span>${esc(WORDS[id].m)}</span></li>`).join("")}</ul>` : '<p class="muted">ما أخطأت في أي كلمة.</p>'}
    <div class="actions">
      <button class="btn ghost" data-a="quit">رجوع</button>
      <button class="btn primary" data-a="again">${q.missed.length ? "أعد الكلمات التي أخطأت فيها" : "اختبار جديد"}</button>
    </div></section>`;
}

function wordsListHTML() {
  const q = ui.q.trim().toLowerCase();
  let list = WORDS;
  if (ui.filter === "hard") list = list.filter(x => S.hard[x.id]);
  if (ui.filter === "learned") list = list.filter(x => S.done.includes(x.d) || S.srs[x.id]);
  if (q) list = list.filter(x => x.w.toLowerCase().includes(q) || x.m.includes(q));
  if (!list.length) return `<p class="empty">${ui.filter === "hard" && !q ? "علّم الكلمة بالنجمة وتظهر هنا." : "ما لقيت كلمة تطابق بحثك."}</p>`;
  return list.map(x => `<div class="wrow" data-id="${x.id}">
    <div class="wmain"><span class="w">${esc(x.w)}</span><span class="m">${esc(x.m)}</span><span class="e">${esc(x.e)}</span></div>
    <div class="wtools"><div class="tl">
      <button class="tool" data-a="speak" aria-label="استمع">${I.speaker}</button>
      <button class="tool ${S.hard[x.id] ? "on" : ""}" data-a="star" aria-pressed="${!!S.hard[x.id]}" aria-label="علّمها كلمة صعبة">${I.star}</button></div>
      <button class="daychip" data-a="jump" data-day="${x.d}">يوم ${x.d}</button></div></div>`).join("");
}
function vWords() {
  const f = [["all", "الكل"], ["hard", "الصعبة"], ["learned", "المتعلّمة"]];
  return `<div class="searchbar"><input id="q" type="search" placeholder="ابحث بالإنجليزي أو بالعربي" value="${esc(ui.q)}" autocomplete="off"></div>
  <div class="seg">${f.map(([v, l]) => `<button class="${ui.filter === v ? "on" : ""}" data-a="filter" data-v="${v}">${l}</button>`).join("")}</div>
  <div id="list" style="margin-top:8px">${wordsListHTML()}</div>`;
}

function vProgress() {
  const L = lessonDay(), mastered = WORDS.filter(w => S.srs[w.id] && S.srs[w.id].box >= 3).length;
  const acc = S.stats.a ? Math.round(S.stats.c / S.stats.a * 100) + "%" : "—";
  let cells = "";
  for (let d = 1; d <= 100; d++) cells += `<button class="cell ${S.done.includes(d) ? "done" : ""} ${d === L && S.done.length < 100 ? "now" : ""}" data-a="jump" data-day="${d}" aria-label="اليوم ${d}">${d}</button>`;
  return `
  <div class="stats">
    <div class="stat"><div class="n">${S.done.length}</div><div class="l">يوم منتهي من 100</div></div>
    <div class="stat"><div class="n">${learnedWords().length}</div><div class="l">كلمة تعلمتها</div></div>
    <div class="stat"><div class="n">${mastered}</div><div class="l">كلمة متقنة</div></div>
    <div class="stat"><div class="n">${acc}</div><div class="l">دقة إجاباتك</div></div>
  </div>
  <p class="sec">خريطة الأيام</p>
  <div class="map">${cells}</div>
  <div class="legend"><span><i class="d"></i>منتهي</span><span><i class="n"></i>درس اليوم</span><span><i></i>قادم</span></div>`;
}

function applyTheme() {
  if (S.theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}

function render(scroll) {
  applyTheme();
  const st = streak(), chip = $("#streak");
  chip.hidden = !st; chip.textContent = st ? "سلسلتك " + arDays(st) : "";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === ui.tab ? "page" : "false"));
  $("#app").innerHTML = ({ today: vToday, practice: vPractice, words: vWords, progress: vProgress })[ui.tab]();
  if (scroll) window.scrollTo({ top: 0 });
}

/* ---------- quiz engine ---------- */
function startIds(ids, scope) {
  ui.quiz = { scope, queue: ids.slice(), total: ids.length, first: {}, correct: 0, missed: [], retried: {}, cur: null, finished: false };
  ui.tab = "practice";
  nextQ(true);
}
function startQuiz(scope) {
  const list = scope === "due" ? dueWords() : scope === "day" ? BY_DAY[ui.view] : scope === "learned" ? learnedWords() : hardWords();
  if (!list.length) { toast("ما في كلمات في هذا القسم بعد"); return; }
  startIds(shuffle(list).slice(0, 10).map(x => x.id), scope);
}
function nextQ(scroll) {
  clearTimeout(ui.timer);
  const q = ui.quiz; if (!q) return;
  if (!q.queue.length) { q.finished = true; render(scroll); return; }
  q.cur = makeQ(q.queue.shift());
  render(scroll);
  if (q.cur.type === "listen") setTimeout(() => speak(WORDS[q.cur.id].w), 200);
  if (q.cur.type === "type") { const a = $("#ans"); if (a) a.focus(); }
}
function answer(ok, chosen) {
  const q = ui.quiz, c = q.cur;
  if (!c || c.answered) return;
  c.answered = true; c.ok = ok; c.chosen = chosen;
  if (!(c.id in q.first)) { q.first[c.id] = ok; if (ok) q.correct++; else q.missed.push(c.id); }
  grade(c.id, ok);
  if (!ok && !q.retried[c.id]) { q.retried[c.id] = 1; q.queue.push(c.id); }
  render();
  if (c.type === "listen" || c.type === "mc") speak(WORDS[c.id].w);
  if (ok) ui.timer = setTimeout(() => nextQ(), 1000);
  else { const b = $("#nextBtn"); if (b) b.focus(); }
}
function submitType() {
  const c = ui.quiz && ui.quiz.cur; if (!c || c.answered) return;
  const el = $("#ans"), v = (el && el.value || "").trim();
  if (!v) { if (el) el.focus(); return; }
  c.typed = v;
  answer(v.toLowerCase() === WORDS[c.id].w.toLowerCase(), null);
}

/* ---------- settings ---------- */
function settingsHTML() {
  const seg = (items, cur, a) => items.map(([v, l]) => `<button class="${String(cur) === String(v) ? "on" : ""}" data-a="${a}" data-v="${v}">${l}</button>`).join("");
  return `<h2>الإعدادات</h2>
  <div class="set"><div class="lbl">المظهر</div><div class="seg">${seg([["auto", "تلقائي"], ["light", "فاتح"], ["dark", "داكن"]], S.theme, "theme")}</div></div>
  <div class="set"><div class="lbl">سرعة النطق</div><div class="seg">${seg([[0.7, "بطيء"], [0.9, "عادي"], [1.1, "سريع"]], S.rate, "rate")}</div></div>
  <div class="set"><div class="lbl">نسخة احتياطية</div><p class="note">تقدمك محفوظ في هذا المتصفح فقط. انسخه واحتفظ به لتسترجعه في متصفح أو جهاز ثاني.</p>
    <div class="row"><button class="btn ghost" data-a="copy">انسخ التقدم</button><button class="btn ghost" data-a="restore">استرجع التقدم</button></div></div>
  <div class="set"><button class="btn danger" data-a="reset">امسح كل التقدم</button></div>
  <div class="row end"><button class="btn primary" data-a="closeSettings">تم</button></div>`;
}
const dlg = () => $("#settings");

/* ---------- actions ---------- */
const A = {
  tab(el) { ui.tab = el.dataset.tab; render(true); },
  prev() { if (ui.view > 1) { ui.view--; render(true); } },
  next() { if (ui.view < 100) { ui.view++; render(true); } },
  goLesson() { ui.view = lessonDay(); ui.tab = "today"; render(true); },
  jump(el) { ui.view = +el.dataset.day; ui.tab = "today"; render(true); },
  flip(el) {
    const art = el.closest(".flash"); art.classList.toggle("is-flipped");
    el.setAttribute("aria-pressed", art.classList.contains("is-flipped"));
  },
  flipAll() {
    const arts = [...document.querySelectorAll(".flash")];
    const to = arts.some(a => !a.classList.contains("is-flipped"));
    arts.forEach(a => { a.classList.toggle("is-flipped", to); a.querySelector(".flip").setAttribute("aria-pressed", to); });
  },
  speak(el) {
    if (el.dataset.say) return speak(el.dataset.say);
    const art = el.closest("[data-id]"); if (!art) return;
    const w = WORDS[+art.dataset.id];
    speak(art.classList.contains("is-flipped") ? w.e : w.w);
  },
  star(el) {
    const id = +el.closest("[data-id]").dataset.id;
    if (S.hard[id]) delete S.hard[id]; else S.hard[id] = 1;
    save();
    if (ui.tab === "words" && ui.filter === "hard") { $("#list").innerHTML = wordsListHTML(); }
    else { el.classList.toggle("on", !!S.hard[id]); el.setAttribute("aria-pressed", !!S.hard[id]); }
    toast(S.hard[id] ? "أضفتها إلى الكلمات الصعبة" : "أزلتها من الكلمات الصعبة");
  },
  done() {
    const v = ui.view, i = S.done.indexOf(v);
    if (i >= 0) { S.done.splice(i, 1); toast("رجع اليوم " + v + " إلى غير منتهي"); }
    else {
      S.done.push(v);
      BY_DAY[v].forEach(w => { if (!S.srs[w.id]) S.srs[w.id] = { box: 0, due: today() }; });
      touch();
      toast(S.done.length >= 100 ? "أنهيت الأيام المئة. مبروك" : "انتهى اليوم " + v + "، باقي " + (100 - S.done.length));
    }
    save(); render();
  },
  quiz(el) { startQuiz(el.dataset.scope); },
  mode(el) { ui.mode = el.dataset.v; render(); },
  opt(el) { const c = ui.quiz.cur, oid = +el.dataset.i; answer(oid === c.id, oid); },
  submit() { submitType(); },
  skip() { const c = ui.quiz.cur; if (c) { c.typed = ""; answer(false, null); } },
  nextQ() { nextQ(); },
  quit() { clearTimeout(ui.timer); ui.quiz = null; render(true); },
  again() {
    const q = ui.quiz;
    if (q.missed.length) startIds(q.missed, q.scope); else startQuiz(q.scope);
  },
  filter(el) { ui.filter = el.dataset.v; render(); },
  openSettings() { dlg().innerHTML = settingsHTML(); dlg().showModal(); },
  closeSettings() { dlg().close(); },
  theme(el) { S.theme = el.dataset.v; save(); applyTheme(); dlg().innerHTML = settingsHTML(); },
  rate(el) { S.rate = +el.dataset.v; save(); dlg().innerHTML = settingsHTML(); speak("Hello, welcome back"); },
  copy() {
    const t = JSON.stringify(S);
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => toast("نسخت تقدمك")).catch(() => prompt("انسخ هذا النص:", t));
    else prompt("انسخ هذا النص:", t);
  },
  restore() {
    const t = prompt("الصق نسخة التقدم هنا");
    if (!t) return;
    try {
      const o = JSON.parse(t);
      if (!o || !Array.isArray(o.done)) throw 0;
      S = Object.assign(fresh(), o); save(); ui.view = lessonDay(); ui.quiz = null; dlg().close(); render(true); toast("استرجعت تقدمك");
    } catch (e) { toast("النص غير صالح. انسخ النسخة الاحتياطية كاملة."); }
  },
  reset() {
    if (!confirm("تمسح كل تقدمك وإحصائياتك؟ ما تقدر ترجعها.")) return;
    S = fresh(); save(); ui.view = 1; ui.quiz = null; dlg().close(); render(true); toast("مسحت التقدم");
  }
};

document.addEventListener("click", e => {
  if (e.target === dlg()) { dlg().close(); return; }
  const el = e.target.closest("[data-a]");
  if (el && A[el.dataset.a]) A[el.dataset.a](el, e);
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { ui.q = e.target.value; $("#list").innerHTML = wordsListHTML(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea")) {
    if (e.key === "Enter" && e.target.id === "ans") submitType();
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  if (ui.tab === "today") {
    if (e.key === "ArrowLeft") A.next();
    else if (e.key === "ArrowRight") A.prev();
    else if (["1", "2", "3"].includes(e.key)) {
      const b = document.querySelectorAll(".flash .flip")[+e.key - 1]; if (b) A.flip(b);
    }
  } else if (ui.tab === "practice" && ui.quiz && !ui.quiz.finished) {
    const c = ui.quiz.cur;
    if (c && !c.answered && c.opts && /^[1-4]$/.test(e.key)) {
      const oid = c.opts[+e.key - 1]; if (oid !== undefined) answer(oid === c.id, oid);
    } else if (c && c.answered && !c.ok && e.key === "Enter") nextQ();
  }
});

render();
</script>
</body>
</html>
